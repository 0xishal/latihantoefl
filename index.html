<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFL Path — Persiapan TOEFL iBT 2026 menuju Band 4.0</title>
<meta name="description" content="Website belajar TOEFL iBT format 2026: materi lengkap, mind map, rangkuman, drill per tipe soal, rencana 12 minggu, dan 3 tryout dengan estimasi skor.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%234f46e5'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Georgia' font-weight='700'>T</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{const t=localStorage.getItem('toeflpath_theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a href="#beranda" class="brand"><span class="logo">T</span><span>TOEFL Path<small>iBT 2026 · Target 4.0</small></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim" data-act="closeSide"></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn only-m" data-act="openSide" aria-label="Buka menu"><i data-lucide="menu"></i></button>
      <div class="crumb" id="crumb"></div>
      <button class="search-btn" data-act="palette" aria-label="Cari"><i data-lucide="search"></i><span>Cari materi, kosakata…</span><kbd>Ctrl K</kbd></button>
      <div class="top-actions">
        <div class="streak" id="streak" title="Hari belajar beruntun"></div>
        <button class="icon-btn" data-act="focus" aria-label="Timer fokus" title="Timer fokus (Pomodoro)"><i data-lucide="timer"></i></button>
        <button class="icon-btn" data-act="theme" aria-label="Ganti tema" title="Mode gelap/terang"><i data-lucide="moon" class="th-dark"></i><i data-lucide="sun" class="th-light"></i></button>
      </div>
    </header>
    <main id="main" class="view"></main>
    <footer class="foot">Dibuat untuk belajar mandiri · Materi mengikuti format TOEFL iBT terbaru (Jan 2026) · Bukan produk resmi ETS. Selalu cek <a href="https://www.ets.org/toefl" target="_blank" rel="noopener">ets.org/toefl</a>.</footer>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Command palette -->
<div class="modal" id="palette" hidden>
  <div class="modal-bg" data-act="closeModal"></div>
  <div class="palette">
    <div class="pal-in"><i data-lucide="search"></i><input id="palInput" placeholder="Cari halaman, topik grammar, atau kosakata…" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="pal-list" id="palList"></div>
  </div>
</div>

<!-- Confirm modal -->
<div class="modal" id="confirm" hidden>
  <div class="modal-bg" data-act="closeModal"></div>
  <div class="dialog" id="confirmBody"></div>
</div>

<!-- Focus timer -->
<div class="focus" id="focus" hidden>
  <div class="focus-head"><b>Timer Fokus</b><button class="icon-btn sm" data-act="focusClose" aria-label="Tutup"><i data-lucide="x"></i></button></div>
  <div class="focus-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="fr-bg"/><circle cx="60" cy="60" r="52" class="fr-fg" id="frFg"/></svg><div class="focus-time" id="focusTime">25:00</div><div class="focus-mode" id="focusMode">Belajar</div></div>
  <div class="seg" id="focusSeg"><button data-act="focusSet" data-m="25" class="on">25 mnt</button><button data-act="focusSet" data-m="45">45 mnt</button><button data-act="focusSet" data-m="5">Istirahat 5</button></div>
  <div class="flex center"><button class="btn" data-act="focusToggle" id="focusBtn"><i data-lucide="play"></i>Mulai</button><button class="btn ghost" data-act="focusReset"><i data-lucide="rotate-ccw"></i></button></div>
</div>
<button class="focus-pill" id="focusPill" data-act="focus" hidden></button>

<div class="toast" id="toast"></div>

<script src="vendor/icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
